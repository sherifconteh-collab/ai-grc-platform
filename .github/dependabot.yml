version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      npm-backend-monthly:
        patterns:
          - "*"
    reviewers:
      - "sherifconteh-collab"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    ignore:
      # @sentry/node 11.x depends on @sentry/bundler-plugins, which depends on
      # `sentry` (FSL-1.1-Apache-2.0, not on the licence allow-list in
      # security.yml's "Check Dependency Licenses"). Stay on 10.x (patch and
      # minor updates still arrive) until that dependency goes away or the
      # owner accepts the licence. See the closed PR #371.
      - dependency-name: "@sentry/node"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      npm-frontend-monthly:
        patterns:
          - "*"
    reviewers:
      - "sherifconteh-collab"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
    groups:
      github-actions-monthly:
        patterns:
          - "*"
    reviewers:
      - "sherifconteh-collab"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # ControlWeave SDK
  - package-ecosystem: "npm"
    directory: "/controlweave-sdk"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      npm-sdk-monthly:
        patterns:
          - "*"
    reviewers:
      - "sherifconteh-collab"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(sdk)"
      include: "scope"
